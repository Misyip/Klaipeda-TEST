<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
    <title>Klaipeda AR Postcard-TEST</title>
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <style>
      body {
        margin: 0;
        overflow: hidden;
      }
      #status {
        position: fixed;
        top: 15px;
        left: 50%;
        transform: translateX(-50%);
        padding: 8px 16px;
        background: rgba(0, 0, 0, 0.75);
        color: #ffffff;
        font-family: sans-serif;
        font-size: 13px;
        border-radius: 20px;
        z-index: 10000;
        pointer-events: none;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div id="status">Loading AR engine...</div>
    
    <!-- a-scene ImageTargetSrc and a-image src can be set as either a local file, as currently in the code, or it can be a direct hosting link to the .mind file and image file. -->
    <a-scene 
      mindar-image="imageTargetSrc: LT-1939-QR.mind; filterMinCF: 0.001; filterBeta: 0.01; missTolerance: 5; warmupTolerance: 5; uiLoading: no; uiScanning: no;" 
      color-space="sRGB" 
      renderer="colorManagement: true, physicallyCorrectLights: false" 
      vr-mode-ui="enabled: false" 
      device-orientation-permission-ui="enabled: false">
      
      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <a-entity id="ar-target" mindar-image-target="targetIndex: 0">
        <a-image 
          id="ar-image"
          src="LT-2026.png" 
          position="0 0 0.01" 
          rotation="0 0 0">
        </a-image>
      </a-entity>
    </a-scene>

    <script>
      const sceneEl = document.querySelector('a-scene');
      const target = document.querySelector('#ar-target');
      const arImage = document.querySelector('#ar-image');
      const statusText = document.querySelector('#status');

      sceneEl.addEventListener('arReady', () => {
        statusText.innerText = "Camera ready. Point it at the historic photo.";
      });

      sceneEl.addEventListener('arError', () => {
        statusText.innerText = "Failed to initialise camera.";
        statusText.style.background = "rgba(220, 20, 20, 0.9)";
      });

      target.addEventListener('targetFound', () => {
        statusText.innerText = "Photo recognised!";
        statusText.style.background = "rgba(0, 180, 80, 0.9)";
      });

      target.addEventListener('targetLost', () => {
        statusText.innerText = "Point at the historic photo.";
        statusText.style.background = "rgba(0, 0, 0, 0.75)";
      });
    </script>
  </body>
</html>
